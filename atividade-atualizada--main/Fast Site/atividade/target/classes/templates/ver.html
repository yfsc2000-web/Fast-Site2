<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yasmin Fernanda</title>
    <link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="container">
    <h1>Yasmin Fernanda</h1>
    <p><b>Nome:</b> <span th:text="${c.nome}"></span></p>
    <p><b>Endereço:</b> <span th:text="${c.endereco}"></span></p>
    <p><b>CEP:</b> <span th:text="${c.cep}"></span></p>

    <p><b>Telefone:</b> <span th:text="${c.telefone}"></span></p>
    <p style="white-space: pre-wrap;"><b>Observação:</b> <span th:text="${c.observacao}"></span></p>
    <a href="/lista">Voltar</a>

</body>
</html>
